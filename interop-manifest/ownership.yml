        mode: live                  # 喂回 ProFeatureCreate/Redefine, 必须留句柄
        free: ProFeatureElemtreeFree # function-specific 释放; 已在真实 Creo iter=1000 零泄漏验证
        free_context: [p_feature]   # 释放所需额外入参(owning feature); L2 handle 在 acquire 时捕获
