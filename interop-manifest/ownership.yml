# interop-manifest/ownership.yml
# 【手工维护真源，禁再生】本表为三态所有权唯一手写真源，禁止任何脚本覆盖(build_ownership.py 已删)。
#   机读消费: tools/CreoToolkit.Generator/gen_free_contract.py 只读本表 functions:/resources: 段,
#   生成 Generated/<V>/FreeContract.g.cs 契约表 + Interop.Tests/FreeContractGuardTests 反射守门。
#   fixed_buffers:/param_direction: 段由 gen_bindings.py 消费(参数封送/方向覆盖)。
# 溯源: 条目据 tools/CreoToolkit.Generator/out/ir.json (Creo4 M140) + protoolkit/includes 注释人工核实。
# Schema: 方案 §5.2 | mode 三态: data=copy-out-free-in | live=留 owned 句柄 | borrowed=即拷不放(原指针禁 free)
# owned: false + borrowed_or_unknown: true  -> 该出参为"容器内部子项借用"，L1 绝不自动 free（默认 owned:true 省略）
# array_free vs element_free: 若资源存在数组级 free(自递归元素), 只记 array_free, 去掉 element_free 防 L1 双重释放(裁定2)
# 判定准则(裁定1): 分配新对象的 producer 才 owned; 取容器内部已有子项不 owned
# 启发式预填(§5.2 rule 1-4)自动建议 + 人工确认 + 泄漏测试验证。除 confirmed:true 外，余 confirmed:false。
# free / free_context (P1-02 增强): 某些资源的正确释放需 function-specific 函数 + 额外上下文入参,
#   单参 default_free 表达不了。free 覆盖 resource.default_free; free_context 列出释放所需的额外入参名
#   (L2 handle 在 acquire 时一并捕获)。典型: ProFeatureElemtreeFree(&feature, elemtree) 需 owning feature。

# ProArray/ProWstring/ProWstringArray/ProSelection/ProElement/ProReference
# 6 个 safe_handle 子类已物删(路径 A try/finally 直调 G.ProXxxFree 已覆盖这些场景)。
# 仅 ProElemtree 仍走 safe_handle(path B NativeHandleResource, 对应 CreoElemtreeHandle.cs);
# ProCollection 走 path A 直调 ProCollectionFree(default_free 记之), 不再挂 safe_handle。
# 其余资源保留 default_free 作元数据真源。复活 safe_handle 路径:重加 safe_handle: 字段 + 写
# 对应 *Handle.cs(可参 commit history 见原设计)。
#
# ── heap-out 扩容放行记录 ──
# 以下 7 函数经四子类扩容(多维基元/struct 定长/struct-pointer 定长/pointee 合成)
# **已放行 A 类**,P/Invoke 签名 heap-out 出参=out IntPtr。守门:
# tests/CreoToolkit.Interop.Tests/GeneratorDirectionGuardTests 的
# D14_5_Expanded_HeapOut_Param_Is_Out_IntPtr(10 条 InlineData)锁签名存在且方向正确。
# 所有权四态并存(见下方 functions 段逐函数登记,禁一刀切):
#   owned→ProArrayFree:ProSeldatSelboxesGet.p_selbox_arr / ProSnapshotTrfsGet.trf_arr
#   owned→ProDimattachmentarrayFree(专用嵌套 free):ProDimensionAttachmentsGet /
#     ProDrawingDimAttachpointsGet / ProGtolAttachMakeDimGet 的 attachments_arr
#     (同函数 dsense_arr 走 ProArrayFree——同函数双出参异 free)
#   borrowed 禁 free:ProEdgedataGet.p_edge_uv_point_arr(归 ProEdgedataFree 嵌套管)
#   unknown 保守 borrowed:ProCableLocationsOnSegEndGet.p_boundries(头文件无 free 句)
# 扩容 runbook 与字符串族豁免边界见 memory `native-bindings-known-unclassified`。
# ─────────────────────────────────────────────────────────────────────
resources:
  ProArray:        { default_free: ProArrayFree                                                  }
  ProWstring:      { default_free: ProWstringFree                                                }
  ProWstringArray: { default_free: ProWstringArrayFree                                           }
  ProSelection:    { default_free: ProSelectionFree                                              }
  ProElement:      { default_free: ProElementFree                                                }
  # ProElemtree: 来自 ProFeatureElemtreeExtract 的 LIVE 树根; 释放须 ProFeatureElemtreeFree(&feat,·)
  #   带 owning feature 上下文, NOT 裸 ProElementFree(已在真实 Creo iter=1000 验证, 见 gate producer)。
  ProElemtree:     { default_free: null,                  safe_handle: CreoElemtreeHandle }
  ProReference:    { default_free: ProReferenceFree                                              }
  ProCollection:   { default_free: ProCollectionFree                                          }
  # 字符串数组三资源(ProUtil.h): Proarray 形态按值收数组; CountedArray 形态 free 需元素数
  ProWstringProarray:     { default_free: ProWstringproarrayFree                                    }
  ProWstringCountedArray: { default_free: ProWstringarrayFree                                       }
  ProStringCountedArray:  { default_free: ProStringarrayFree                                        }

