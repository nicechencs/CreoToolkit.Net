# 指针出参方向覆盖真源。value in {ref, out, in};优先于生成器命名启发式(Free→ref/余 out)。
# 用于"读入现有指针、可能 realloc 后写回"的形态:命名启发式误判为 out 会让 native 解引用
# 未初始化指针 → 崩。引用不存在的函数/参数名 gen_bindings.py 会 fail-fast 报错。
# in = 传值实参(OHandle/ProArray 实参本身,平传 IntPtr 无修饰,可传 IntPtr.Zero 表 NULL)。
#   用于 ProArray-of-handle 输入(形态 `ProXxx *arr` 其中值本身就是数组基指针):out/ref 都会
#   让 CLR 多传一层指针(层级+1)且 out 语义下 native 读到未初始化槽 → 崩;in 才是正确 ABI。
#   与单句柄输入(ref,见缺口4)的区分:头文件文档写 "A ProArray of ..." → in;写单个
#   handle/pointer → ref。
# ProArray 写族(ProArray.h):p_array 传入现有数组地址,函数可能 realloc 后写回 → 必须 ref。
#   (ProArrayAlloc 的 p_array 是纯输出 producer,保持 out;ProArrayFree 由 Free 命名规约已得 ref。)
param_direction:
  ProArraySizeSet:
    p_array: ref
  ProArrayObjectAdd:
    p_array: ref
  ProArrayObjectRemove:
    p_array: ref
  # 单句柄输入(缺口4):形态 `ProXxx *p`(指向单个句柄的指针)是纯输入,被 depth==2 out-handle
  #   启发式误判为 `out IntPtr`(native 读入参却拿到未初始化槽 → 未定义行为)。判据:全 IR
  #   depth==2 命中 out-handle 启发式 → 头文件 Input Arguments 段列名且 Output 段不列 →
  #   非 *Free/*Alloc → 非数组(区别于 param_input_array)→ 单句柄输入。改 ref:调用方传有效句柄地址,
  #   native 只读不写回。逐个按头文件核对(状态梳理已闭环删除,原文见 git 历史 generator-marshalling-status.md 真缺口4)。
  #   注:ProClcmdElemGetByIndex.r_ncl_cmd_elem 虽列 Input 段但 Purpose 是 "Gets the pointer to"
  #   实为出参(头文件 doc 自误),保持 out 不登记。
  ProSelectionViewSet:
    p_prosel: ref              # ProSelection.h "pointer to user-provided ProSelection"
  ProSelectionPoint3dSet:
    p_prosel: ref              # ProSelection.h "Pointer to user-provided ProSelection"
  ProSelectionDtlsyminstEntityGet:
    selection: ref             # ProDtlsyminst.h Input "Selection of the entity"(从 selection 取 entity)
  ProCablingIsHarness:
    p_mdl: ref                 # ProCabling.h Input "The model handle"
  ProSecerrorAdd:
    PUserErr: ref              # ProSecerror.h Input "pointer to the errors table"(caller 经 ProSecerrorAlloc 初始化)
  ProSecerrorCount:
    PUserErr: ref              # ProSecerror.h Input "A pointer to the errors table"
  ProNoteAttachRelease:
    p_note_att: ref            # ProNote.h Input "pointer to the handle"(释放语义,native 读句柄后置空)
  ProDispObjectDelete:
    obj: ref                   # ProDispObject.h Input "ProDisplayObject which will be deleted"
  ProClcmdElemRemove:
    r_ncl_cmd_elem: ref        # ProClcmdElem.h Input "The element to remove"(Purpose "given its data" 与 Input 一致)
  # ProArray-of-handle 输入(in):值本身是数组基指针,平传 IntPtr,可传 Zero。判据:头文件
  #   Input Arguments 段明写 "A ProArray of ..." 且 Output 段不列;逐个按头文件核对。
  ProSelect:
    p_in_sel: in               # ProSelection.h Input "A ProArray of pointers to ProSelection ... This can be NULL"
  ProReferencearrayToSelections:
    references: in             # ProReference.h Input "The ProArray of reference handles"
  ProSelectionarrayToReferences:
    selections: in             # ProReference.h Input "ProArray of selection handles"
  ProAsmcompConstraintsSet:
    p_constraints: in          # ProAsmcomp.h Input "ProArray of constraints"; INVALID_PTR 校验 ProArray 头,须平传句柄本体
  # 单句柄输入(缺口4 续,D15/D16 新放行函数首曝):
  ProCurvesCollect:
    collection: ref            # ProCollect.h Input "must be allocated by calling ProCrvcollectionAlloc()"(caller 预分配,函数向对象内追加)
  ProGtolleaderZExtensionlineGet:
    leader: ref                # ProGtol.h Input "gtol leader"(单句柄输入,native 只读)
  # ProWstring 写族(ProWstring.h):p_array 传入现有数组地址,可能 realloc 后写回 → ref
  #   (同 ProArray 写族先例;ProWstringArrayFree 由 Free 命名规约已得 ref)。
  ProWstringArrayObjectAdd:
    p_array: ref               # ProWstring.h Input "The address of the array"
  ProWstringArrayObjectRemove:
    p_array: ref               # ProWstring.h Input "The address of the array"
  ProWstringArraySizeSet:
    p_array: ref               # ProWstring.h Input "The address of the array whose size should be changed"
  # ProArray-of-wstring 输入(in):
  ProServerMultiobjectsCheckout:
    files: in                  # ProWTUtils.h Input "ProArray of top level objects"(值即 ProArray 基指针)
  # ProArray-of-handle 输入(in):
  ProQuiltdataSurfArraySet:
    arr_p_surf: in             # ProQuiltdata.h Input "The ProArray of pointers to surfaces of the quilt"
  # ProArray 输入(in):头文件 Input 段明写 "ProArray of ..." 或 Purpose 写 "proarray",
  #   native 按 ProArray 布局(header+元素区)解读,[In] IntPtr[] 封送裸元素区无头 → 平传 IntPtr。
  ProAnnotationelemArrayReferencesSet:
    reference_set: in          # ProAnnotationElem.h "ProArray of annotation reference sets"
  ProAnnotationfeatElementArrayDelete:
    elements: in               # ProAnnotationFeat.h "ProArray of the annotation elements"
  ProCablelocationrefAlloc:
    refs: in                   # ProCabling.h "ProArray of ProSelections"
  ProCurrentWorkspaceExport:
    source_objects: in         # ProWorkspace.h "ProArray of names of objects"
  ProCurrentWorkspaceImport:
    source_objects: in         # ProWorkspace.h "ProArray of paths to objects"
  ProDimensionAutoOrdinateCreate:
    surface_array: in          # ProDimension.h "must be a ProArray of ProSelection"
  # ProDimAttachment(=ProSelection[2])与 ProDimSense 数组输入:头文件 Input 段明写 "ProArray of
  #   attachments/dsense"; ProArraySizeGet 从 header 负偏移取长度,pin 的 C# 数组无 header 会崩,
  #   须平传 ProArray 句柄(caller L3 用 ProArrayAlloc/ObjectAdd 构造)。三函数同款处置。
  ProDimensionCreate:
    attachments_arr: in        # ProDimension.h "ProArray of attachments"
    dsense_arr: in             # ProDimension.h "ProArray of dimension sense"
  ProDimensionAttachmentsSet:
    attachments_arr: in        # ProDimension.h "ProArray of attachments"
    dsense_arr: in             # ProDimension.h "ProArray of dimension sense"
  # strip_size:头文件明写 ProArray → 依 07-04 ProArray 政策平传 IntPtr(句柄本体,负偏移 header
  #   存长度,CLR 数组 pin 无 header → INVALID_PTR,A-1 真机先例)。tkuse 25008 二轨佐证。
  ProDispObjectCreate:
    strip_size: in             # ProDispObject.h:51 Input "ProArray (of size num_strips) indicating the number of triangles in each strip"
  # DEPRECATED Since Creo 4.0(depr_map 66);SUCCESSOR=ProDrawingDimensionCreate(其 attachment_arr/
  #   dsense_arr 同为平传 IntPtr,生成物互证)。shape 依 07-04 ProArray 政策平传 IntPtr,deprecated 不入 SDK 表面。
  ProDrawingDimCreate:
    attachments_arr: in        # ProDrawing.h:610 Input "ProArray of attachments"
    dsense_arr: in             # ProDrawing.h:611 Input "ProArray of sense"
  ProDrawingDimensionCreate:
    attachment_arr: in         # ProDrawing.h "ProArray of Attachments"(注意参数名单数)
    dsense_arr: in             # ProDrawing.h "ProArray of sense"
  # ProDrawingOrdinateDimensionsCreate / ProDimattachmentarrayFree:D16 struct-pointer 扩容后
  #   (2026-07-05)首次可 A 类放行;沿用同族 ProArray 语义登记覆盖以修正 mapper 默认启发式产出的
  #   `ref pro_dim_sense` / `ref pro_model_item` / 无 ref 修饰的 Free 参数等错签名。
  ProDrawingOrdinateDimensionsCreate:
    attachment_array: in       # ProDimension.h "ProArray of dimension attachments"
    sense_array: in            # ProDimension.h "ProArray of dimension sense"
    dim_array: out             # ProDimension.h Output "ProArray of created dimension. Free using ProArrayFree()"
                               # 头文件形态 depth=1(`ProDimension* dim_array`,缺 `*`)但语义 heap-out;
                               # x64 上 void*/void** 同宽度不影响 out IntPtr 生成,以 Output 段 Free 契约为真源。
  ProGtolAttachMakeDimSet:
    attachments_arr: in        # ProGtolAttach.h Input "ProArray of pair of selections"
    dsense_arr: in             # ProGtolAttach.h Input "ProArray of dimension sense"
  # 按值传数组基指针:ProDimension.h:174 `typedef ProSelection ProDimAttachment[2]`,
  # :1680 形参 `ProDimAttachment *attachments_arr` 按值;官方样例 TestDimension.c:793
  # `ProDimattachmentarrayFree(sel_arr)` 直接按值,与紧邻的 `ProArrayFree((ProArray*)&sense_arr)`
  # 取地址形成铁证对照。ownership.yml 早期 `ref` 是启发式误覆盖,generator 默认已能推正确。
  ProDimattachmentarrayFree:
    attachments_arr: in
